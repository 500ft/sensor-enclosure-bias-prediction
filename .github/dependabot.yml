version: 2
# One grouped PR per ecosystem per month. Security updates are separate and
# still arrive as soon as an advisory is published.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      pip:
        patterns: ["*"]
    # Keep ">=" ranges as written; only bump pins, or a range the new release falls outside.
    versioning-strategy: increase-if-necessary
