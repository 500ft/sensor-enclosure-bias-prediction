name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'task/priority-one-*']

jobs:
  research-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install analysis dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile analysis scripts
        run: python -m compileall -q analysis
      - name: Test reliability accounting, thermal controls and CLI boundaries
        run: python -m unittest discover -s analysis/tests -v
      - name: Check bibliography coverage
        run: python analysis/check_literature_coverage.py
      - name: Regenerate and verify committed day and night thermal tables
        run: |
          python analysis/thermal_bias.py --no-figure --table "$RUNNER_TEMP/thermal-day.csv" --night-table "$RUNNER_TEMP/thermal-night.csv"
          diff -u analysis/output/thermal_bias_table.csv "$RUNNER_TEMP/thermal-day.csv"
          diff -u analysis/output/thermal_bias_night_table.csv "$RUNNER_TEMP/thermal-night.csv"
      - name: Check README links, identity and negative controls
        run: |
          python tools/check_presentation.py . "Sensor Enclosure Bias Prediction" sensor-enclosure-bias-prediction
          python tools/test_presentation.py
